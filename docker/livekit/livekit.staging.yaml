# Staging LiveKit SFU (EC2). Not --dev: keys must match LIVEKIT_* in .env.
# Browsers use wss://live.test.amitverma01.dev (nginx). Nest uses http://127.0.0.1:7880.
# Security group: TCP 7881 + UDP 7882 (media), plus 80/443 for signaling via nginx.

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
  # Helps when the instance is behind AWS NAT / Elastic IP.
  # stun_servers:
  #   - stun:stun.l.google.com:19302

keys:
  APIstaginghirance01: staging-livekit-api-secret-at-least-32-chars!!

logging:
  level: info
