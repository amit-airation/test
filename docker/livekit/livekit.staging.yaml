# Staging LiveKit SFU (EC2 / Docker Compose).
# Signaling: browsers → wss://live.test.amitverma01.dev (nginx) → :7880
# Media: browsers → Elastic IP :7881/TCP and :7882/UDP (NOT through nginx)
#
# Keys must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in repo-root .env.
#
# ICE: entrypoint always passes --node-ip (LIVEKIT_NODE_IP or auto-detect).
# use_external_ip must be false when --node-ip is set (LiveKit precedence).
#
# Security group + ufw must allow TCP 7881 and UDP 7882.

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  allow_tcp_fallback: true
  stun_servers:
    - stun:stun.l.google.com:19302
    - stun:stun1.l.google.com:19302

keys:
  APIstaginghirance01: staging-livekit-api-secret-at-least-32-chars!!

logging:
  level: info
