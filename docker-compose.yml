# One command for the full stack (EC2 staging / production).
#
#   npm run ssl:cert:webroot   # after DNS points here (or first-time standalone)
#   docker compose up -d --build
#
#   UI      https://test.amitverma01.dev
#   API     https://api.test.amitverma01.dev
#   Screen  LiveKit Cloud (LIVEKIT_PUBLIC_URL in .env) — not proxied by nginx
#
# Optional self-hosted SFU (legacy):
#   docker compose --profile self-hosted-livekit up -d livekit
#
# Job server api.hirance.com →
#   POST https://api.test.amitverma01.dev/api/integrations/job-events

services:
  postgres:
    image: postgres:16
    container_name: hirance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirance
      POSTGRES_PASSWORD: hirance
      POSTGRES_DB: hirance
    ports:
      - "5432:5432"
    volumes:
      - hirance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirance -d hirance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hirance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hirance_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Legacy / optional — production uses LiveKit Cloud from .env
  livekit:
    profiles: ["self-hosted-livekit"]
    image: livekit/livekit-server:v1.9.2
    container_name: hirance-livekit
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      LIVEKIT_CONFIG: /etc/livekit.yaml
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-}
    volumes:
      - ./docker/livekit/livekit.staging.yaml:/etc/livekit.yaml:ro
      - ./docker/livekit/entrypoint.sh:/entrypoint.sh:ro
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  certs:
    image: alpine:3.20
    container_name: hirance-certs
    volumes:
      - ./docker/nginx/certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache openssl >/dev/null
        if [ ! -f /certs/fullchain.pem ] || [ ! -f /certs/privkey.pem ]; then
          echo "Generating temporary self-signed cert (replace with: npm run ssl:cert:webroot)"
          openssl req -x509 -nodes -days 7 -newkey rsa:2048 \
            -keyout /certs/privkey.pem \
            -out /certs/fullchain.pem \
            -subj "/CN=test.amitverma01.dev"
        fi

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hirance-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://hirance:hirance@postgres:5432/hirance?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Production: LiveKit Cloud from repo-root .env (required for screen share)
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.test.amitverma01.dev/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-https://api.test.amitverma01.dev}
        NEXT_PUBLIC_EVENT_KEY: ${NEXT_PUBLIC_EVENT_KEY:-}
    container_name: hirance-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    build:
      context: ./docker/nginx
    container_name: hirance-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      API_UPSTREAM: api:3001
      WEB_UPSTREAM: web:3000
      UI_SERVER_NAME: ${UI_SERVER_NAME:-test.amitverma01.dev}
      API_SERVER_NAME: ${API_SERVER_NAME:-api.test.amitverma01.dev}
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  hirance_postgres_data:
  hirance_redis_data:
