services:
  postgres:
    image: postgres:16
    container_name: hirance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirance
      POSTGRES_PASSWORD: hirance
      POSTGRES_DB: hirance
    ports:
      - "5432:5432"
    volumes:
      - hirance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirance -d hirance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hirance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hirance_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-only SFU for Phase 7 screen sharing. Uses LiveKit --dev keys
  # (devkey/secret). Never use those keys in production.
  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: hirance-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  hirance_postgres_data:
  hirance_redis_data:
