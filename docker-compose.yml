services:
  postgres:
    image: postgres:16
    container_name: hirance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirance
      POSTGRES_PASSWORD: hirance
      POSTGRES_DB: hirance
    ports:
      - "5432:5432"
    volumes:
      - hirance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirance -d hirance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hirance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hirance_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dev-only SFU for Phase 7 screen sharing. Uses LiveKit --dev keys
  # (devkey/secret). Never use those keys in production.
  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: hirance-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # Reverse proxy — UI / API / LiveKit hosts (profile nginx).
  # Staging SFU with strong keys: docker compose -f docker-compose.prod.yml up -d livekit
  # Local --dev SFU only: docker compose up -d livekit
  nginx:
    profiles: ["nginx"]
    build:
      context: ./docker/nginx
    container_name: hirance-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-host.docker.internal:3001}
      WEB_UPSTREAM: ${WEB_UPSTREAM:-host.docker.internal:3000}
      LIVEKIT_UPSTREAM: ${LIVEKIT_UPSTREAM:-host.docker.internal:7880}
      UI_SERVER_NAME: ${UI_SERVER_NAME:-test.amitverma01.dev}
      API_SERVER_NAME: ${API_SERVER_NAME:-api.test.amitverma01.dev}
      LIVEKIT_SERVER_NAME: ${LIVEKIT_SERVER_NAME:-live.test.amitverma01.dev}
    volumes:
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./docker/nginx/certbot/www:/var/www/certbot:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  hirance_postgres_data:
  hirance_redis_data:
