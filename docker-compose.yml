services:
  postgres:
    image: postgres:16
    container_name: hirance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hirance
      POSTGRES_PASSWORD: hirance
      POSTGRES_DB: hirance
    ports:
      - "5432:5432"
    volumes:
      - hirance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirance -d hirance"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hirance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hirance_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hirance_postgres_data:
  hirance_redis_data:
